<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة سائق التوصيل - ديليفري الأتارب</title><style>body{font-family:system-ui,Tahoma,Arial;background:#f4f7f5;color:#17211b;margin:0}header{background:#16834a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dfe8e2;border-radius:14px;padding:16px;margin:12px 0}button{background:#16834a;color:white;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px}input,select{font:inherit;padding:10px;border:1px solid #ccd7d0;border-radius:9px;width:100%;box-sizing:border-box;margin:6px 0 12px}.muted{color:#64746a}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.danger{background:#a72b2b}a{color:white}</style></head><body><header><h2>لوحة سائق التوصيل</h2><div>ديليفري الأتارب • <a href="./">واجهة الزبون</a></div></header><main><section id="login" class="panel"><h3>تسجيل الدخول</h3><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button id="loginBtn">دخول</button><p id="message" class="muted">الدخول مخصص للحسابات المصرّح لها فقط.</p></section><section id="app" class="hidden"><div class="row"><h3>لوحة سائق التوصيل</h3><button onclick="start()">تحديث الطلبات</button></div><p class="muted">الطلبات المعيّنة لحساب السائق فقط.</p><div id="orders"></div></section></main><script>
const URL="https://apreejawamptetdflwcf.supabase.co",KEY="sb_publishable_amN_E9EIKrjl_fk-ndm1YA_R7mI24j7";let session=null;let isAdmin=false;const SESSION_KEY="delivery_driver_session_v1";
function saveSession(){if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));}
function clearSession(){session=null;isAdmin=false;localStorage.removeItem(SESSION_KEY);}
function showApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");if(isAdmin)document.querySelector("#app .muted").textContent="وضع المدير: متابعة الطلبات الجاهزة للتوصيل والطلبات بالطريق.";else document.querySelector("#app .muted").textContent="الطلبات المعيّنة لحساب السائق فقط.";}
async function auth(path,body){let r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"فشل تسجيل الدخول");return d}
async function refreshSession(){if(!session?.refresh_token)throw Error("انتهت الجلسة، سجّل الدخول من جديد.");session=await auth("token?grant_type=refresh_token",{refresh_token:session.refresh_token});saveSession();return session}
async function api(path,opts={}){let r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}});if(r.status===401){await refreshSession();r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}})}let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mapDetails(address){const raw=String(address||"");const m=raw.match(/\[MAP:([+-]?\d+(?:\.\d+)?),([+-]?\d+(?:\.\d+)?)\]/);if(!m)return {text:raw,url:""};const lat=Number(m[1]),lng=Number(m[2]);return {text:raw.replace(/\s*\[MAP:[^\]]+\]/,"").trim(),url:Number.isFinite(lat)&&Number.isFinite(lng)?"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(lat+","+lng)+"&travelmode=driving":""}}
document.getElementById("loginBtn").onclick=async()=>{let m=document.getElementById("message"),b=document.getElementById("loginBtn");b.disabled=true;try{session=await auth("token?grant_type=password",{email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});const role=session.user?.app_metadata?.role;isAdmin=role==="admin";if(!isAdmin&&role!=="driver"){session=null;throw Error("هذا الحساب ليس مخوّلاً لهذه اللوحة.");}saveSession();showApp();await start();}catch(e){m.textContent=e.message||"تعذر الدخول";}finally{b.disabled=false}};
async function updateStatus(id,status){await api("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});await start()}
async function start(){const filter=isAdmin?"status=in.(قيد التحضير,بالطريق)":"assigned_driver_id=eq."+encodeURIComponent(session.user.id)+"&status=in.(قيد التحضير,بالطريق)";const os=await api("orders?select=id,order_number,customer_name,customer_phone,delivery_address,status,created_at&"+filter+"&order=created_at.asc");document.getElementById("orders").innerHTML=os.map(o=>{const loc=mapDetails(o.delivery_address);const id=esc(o.id);return `<article class="panel"><div class="row"><b>طلب #${esc(o.order_number)}</b><b>${esc(o.status)}</b></div><p>الزبون: ${esc(o.customer_name)} • ${esc(o.customer_phone)}</p><p>العنوان: ${esc(loc.text)}</p>${loc.url?`<p><a style="display:inline-block;background:#1769aa;color:white;padding:10px 14px;border-radius:10px;text-decoration:none" target="_blank" rel="noopener" href="${loc.url}">📍 افتح موقع الزبون في خرائط Google</a></p>`:'<p class="muted">ما في إحداثيات خريطة محفوظة لهالطلب.</p>'}<button onclick="updateStatus('${id}','بالطريق')">استلام الطلب — بالطريق</button><button onclick="updateStatus('${id}','تم التسليم')">تم التسليم</button></article>`}).join("")||'<div class="panel">ما في طلبات معيّنة إلك حالياً.</div>'}
window.addEventListener("DOMContentLoaded",async()=>{try{const saved=localStorage.getItem(SESSION_KEY);if(!saved)return;session=JSON.parse(saved);if(!session?.refresh_token){clearSession();return}if(session.expires_at&&Date.now()/1000>session.expires_at-60)await refreshSession();const role=String(session.user?.app_metadata?.role||"").toLowerCase().trim();isAdmin=role==="admin";if(!isAdmin&&role!=="driver"){document.getElementById("message").textContent="صلاحية الحساب الحالية ("+(role||"غير محددة")+") لا تسمح بدخول لوحة السائق.";clearSession();return}showApp();await start()}catch(e){document.getElementById("orders").innerHTML='<div class="panel">تعذر استعادة الجلسة أو تحميل الطلبات: '+esc(e.message||"خطأ غير معروف")+'</div>';if(!session?.refresh_token)clearSession()}});</script></body></html>
