<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة سائق التوصيل - ديليفري الأتارب</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{font-family:system-ui,Tahoma,Arial;background:#f4f7f5;color:#17211b;margin:0}header{background:#16834a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dfe8e2;border-radius:14px;padding:16px;margin:12px 0}button{background:#16834a;color:white;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px}input,select{font:inherit;padding:10px;border:1px solid #ccd7d0;border-radius:9px;width:100%;box-sizing:border-box;margin:6px 0 12px}.muted{color:#64746a}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.danger{background:#a72b2b}.map{height:260px;border-radius:12px;overflow:hidden;margin:10px 0}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;background:#e5eee8;color:#17613a;border:1px solid #c8ddcf}.tabs button.active{background:#16834a;color:white}a{color:white}</style></head><body><header><h2>لوحة سائق التوصيل</h2><div>ديليفري الأتارب • <a href="./">واجهة الزبون</a></div></header><main><section id="login" class="panel"><h3>تسجيل الدخول</h3><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button id="loginBtn">دخول</button><p id="message" class="muted">الدخول مخصص للحسابات المصرّح لها فقط.</p></section><section id="app" class="hidden"><div class="row"><h3>لوحة سائق التوصيل</h3><button onclick="start()">تحديث الطلبات</button></div><p class="muted">الطلبات المتاحة تظهر للسائقين؛ أول سائق يستلم الطلب يُحجز له. اسمح بالموقع لعرض المسار.</p><div class="panel"><button id="locateDriverBtn" type="button">📍 تحديد موقعي</button><span id="driverLocationStatus" class="muted">الموقع غير محدد</span></div><div id="orders"></div></section></main><script>
const URL="https://apreejawamptetdflwcf.supabase.co",KEY="sb_publishable_amN_E9EIKrjl_fk-ndm1YA_R7mI24j7";let session=null;let isAdmin=false;let driverPosition=null;let driverWatch=null;const SESSION_KEY="delivery_driver_session_v1";
function saveSession(){if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));}
function clearSession(){session=null;isAdmin=false;localStorage.removeItem(SESSION_KEY);}
function showApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");if(isAdmin)document.querySelector("#app .muted").textContent="وضع المدير: متابعة الطلبات الجاهزة للتوصيل والطلبات بالطريق.";else document.querySelector("#app .muted").textContent="الطلبات المعيّنة لحساب السائق فقط.";if(!document.getElementById("enableDriverPush")){const b=document.createElement("button");b.id="enableDriverPush";b.textContent="🔔 تفعيل إشعارات السائق";b.onclick=enableDriverPush;document.querySelector("#app .panel").appendChild(b);const s=document.createElement("span");s.id="driverPushStatus";s.className="muted";s.textContent="فعّل التنبيهات لاستقبال الطلبات الجديدة.";document.querySelector("#app .panel").appendChild(s);}}
async function auth(path,body){let r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||d.error||"فشل تسجيل الدخول ("+r.status+")");return d}
async function refreshSession(){if(!session?.refresh_token)throw Error("انتهت الجلسة، سجّل الدخول من جديد.");session=await auth("token?grant_type=refresh_token",{refresh_token:session.refresh_token});saveSession();return session}
async function api(path,opts={}){let r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}});if(r.status===401){await refreshSession();r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}})}let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mapDetails(address){const raw=String(address||"");const m=raw.match(/\[MAP:([+-]?\d+(?:\.\d+)?),([+-]?\d+(?:\.\d+)?)\]/);if(!m)return {text:raw,lat:null,lng:null};const lat=Number(m[1]),lng=Number(m[2]);return {text:raw.replace(/\s*\[MAP:[^\]]+\]/,"").trim(),lat:Number.isFinite(lat)&&Math.abs(lat)<=90?lat:null,lng:Number.isFinite(lng)&&Math.abs(lng)<=180?lng:null}}
document.getElementById("loginBtn").onclick=async()=>{let m=document.getElementById("message"),b=document.getElementById("loginBtn");b.disabled=true;try{session=await auth("token?grant_type=password",{email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});const role=String(session.user?.app_metadata?.role||"").toLowerCase().trim();if(role!=="admin"&&role!=="driver"){clearSession();throw Error("هذا الحساب غير مخوّل لدخول لوحة السائق.");}isAdmin=role==="admin";saveSession();showApp();await start();await restoreDriverPush();}catch(e){m.textContent=e.message||"تعذر الدخول";}finally{b.disabled=false}};
async function updateStatus(id,status){await api("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});await start()}

async function claimDeliveryOrder(id){if(!confirm("تأكيد استلام هذا الطلب؟"))return;try{const result=await api("rpc/claim_delivery_order",{method:"POST",body:JSON.stringify({p_order_id:id})});if(!result||!result.success){alert(result?.message||"الطلب لم يعد متاحاً؛ ربما استلمه سائق آخر.");}else{alert("تم استلام الطلب لحسابك.");}}catch(e){alert("تعذر استلام الطلب: "+(e.message||"خطأ"));}await start()}
async function enableDriverPush(){const b=document.getElementById("enableDriverPush"),s=document.getElementById("driverPushStatus");b.disabled=true;try{if(!("Notification"in window)||!("serviceWorker"in navigator)||!("PushManager"in window))throw Error("المتصفح لا يدعم الإشعارات.");if(await Notification.requestPermission()!=="granted")throw Error("لم يتم السماح بالإشعارات.");const keyResponse=await fetch(URL+"/functions/v1/push-public-key");const h=await keyResponse.json();if(!keyResponse.ok||!h.vapid_public_key)throw Error(h.error||"مفتاح الإشعارات غير متاح.");const bytes=Uint8Array.from(atob((h.vapid_public_key+"=".repeat((4-h.vapid_public_key.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));const reg=await navigator.serviceWorker.register("./service-worker.js");await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});await api("push_subscriptions?on_conflict=endpoint,audience",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({endpoint:sub.endpoint,subscription:sub.toJSON(),audience:"driver",driver_user_id:session.user.id,store_id:null,order_id:null})});b.textContent="✅ إشعارات السائق مفعّلة";s.textContent="تم حفظ اشتراك هذا الحساب.";}catch(e){s.textContent="تعذر التفعيل: "+(e.message||"خطأ");}finally{b.disabled=false;}}
async function restoreDriverPush(){const b=document.getElementById("enableDriverPush"),s=document.getElementById("driverPushStatus");try{if(!("Notification"in window)||!("serviceWorker"in navigator)||!("PushManager"in window))return;if(Notification.permission!=="granted"){s.textContent="الإشعارات غير مسموحة من إعدادات المتصفح؛ فعّلها مرة واحدة من زر التفعيل.";return;}const reg=await navigator.serviceWorker.register("./service-worker.js");await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub){s.textContent="لا يوجد اشتراك محفوظ؛ اضغط زر تفعيل الإشعارات مرة واحدة.";return;}await api("push_subscriptions?on_conflict=endpoint,audience",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({endpoint:sub.endpoint,subscription:sub.toJSON(),audience:"driver",driver_user_id:session.user.id,store_id:null,order_id:null})});b.textContent="✅ إشعارات السائق مفعّلة";s.textContent="الإشعارات مفعّلة ومحفوظة؛ ستُستعاد تلقائياً عند فتح الصفحة.";}catch(e){s.textContent="تعذر استعادة الإشعارات تلقائياً: "+(e.message||"خطأ");}}
function locateDriver(){const s=document.getElementById("driverLocationStatus");if(!navigator.geolocation){s.textContent="المتصفح لا يدعم تحديد الموقع.";return;}s.textContent="جارٍ تحديد موقعك...";navigator.geolocation.getCurrentPosition(p=>{driverPosition={lat:p.coords.latitude,lng:p.coords.longitude};s.textContent="تم تحديد موقعك.";startWatch();start();},e=>{s.textContent=e.code===1?"اسمح للمتصفح باستخدام الموقع.":"تعذر تحديد الموقع؛ تحقق من GPS والإنترنت."},{enableHighAccuracy:true,timeout:15000,maximumAge:0});}
function startWatch(){if(driverWatch!==null||!navigator.geolocation.watchPosition)return;driverWatch=navigator.geolocation.watchPosition(p=>{driverPosition={lat:p.coords.latitude,lng:p.coords.longitude};document.getElementById("driverLocationStatus").textContent="يتم تحديث موقعك أثناء فتح الصفحة.";},()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000});}
document.getElementById("locateDriverBtn").addEventListener("click",locateDriver);
function showDriverTab(tab){document.querySelectorAll(".driver-tab-panel").forEach(p=>p.classList.toggle("hidden",p.id!=="driver-tab-"+tab));document.querySelectorAll(".driver-tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));}
function renderMaps(){if(!window.L)return;document.querySelectorAll(".map").forEach(el=>{if(el.dataset.ready==="1")return;const lat=Number(el.dataset.lat),lng=Number(el.dataset.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const map=L.map(el).setView([lat,lng],14);el.dataset.ready="1";L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);L.marker([lat,lng]).addTo(map).bindPopup("موقع الزبون");if(driverPosition){L.marker([driverPosition.lat,driverPosition.lng]).addTo(map).bindPopup("موقعك الحالي");const line=L.polyline([[driverPosition.lat,driverPosition.lng],[lat,lng]],{color:"blue",weight:4}).addTo(map);map.fitBounds(line.getBounds(),{padding:[25,25]});}setTimeout(()=>map.invalidateSize(),100);});}

async function start(){const box=document.getElementById("orders");box.innerHTML='<div class="panel">جارٍ تحميل الطلبات...</div>';try{const statuses="status=in.(جديد,قيد التحضير,بالطريق)";let os=[],available=[];if(isAdmin){os=await api("orders?select=id,order_number,customer_name,customer_phone,delivery_address,notes,status,created_at,assigned_driver_id&"+statuses+"&order=created_at.desc");available=await api("rpc/list_available_delivery_orders",{method:"POST",body:"{}"});}else{os=await api("orders?select=id,order_number,customer_name,customer_phone,delivery_address,notes,status,created_at,assigned_driver_id&assigned_driver_id=eq."+encodeURIComponent(session.user.id)+"&"+statuses+"&order=created_at.desc");available=await api("rpc/list_available_delivery_orders",{method:"POST",body:"{}"});}
const allOrders=[...new Map([...available,...os].map(o=>[String(o.id),o])).values()];available.sort((a,b)=>Date.parse(b.created_at||0)-Date.parse(a.created_at||0));os.sort((a,b)=>Date.parse(b.created_at||0)-Date.parse(a.created_at||0));const itemsByOrder=new Map();if(allOrders.length){const ids=allOrders.map(o=>o.id).filter(Boolean);if(ids.length){const items=await api("order_items?select=order_id,product_name,quantity,unit_price_syp,line_total_syp&order_id=in.("+ids.join(",")+")");for(const it of items){const k=String(it.order_id);if(!itemsByOrder.has(k))itemsByOrder.set(k,[]);itemsByOrder.get(k).push(it);}}}
const render=(o,canClaim)=>{const loc=mapDetails(o.delivery_address),id=String(o.id||"");const mine=String(o.assigned_driver_id||"")===String(session.user.id);const actions=canClaim?"<button onclick=\"claimDeliveryOrder('"+id+"')\">🛵 استلام الطلب</button>":(!isAdmin&&mine?"<button onclick=\"updateStatus('"+id+"','بالطريق')\">بدء التوصيل</button><button onclick=\"updateStatus('"+id+"','تم التسليم')\">تم التسليم</button>":"");const hasLoc=loc.lat!==null&&loc.lng!==null;const map=hasLoc?'<div class="map" id="map-'+esc(id)+'" data-lat="'+loc.lat+'" data-lng="'+loc.lng+'"></div><p><a style="display:inline-block;background:#1769aa;color:white;padding:10px 14px;border-radius:10px;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(loc.lat+","+loc.lng)+'&travelmode=driving">🗺️ افتح الطريق في خرائط Google</a></p>':'<p class="muted">ما في إحداثيات محفوظة لهذا الطلب؛ الزبون لازم يحدد موقعه عند الطلب.</p>';const its=itemsByOrder.get(id)||[];const noteText=String(o.notes||"");const customMatch=noteText.match(/المتجر:\s*([\s\S]*?)\s*\|\s*تفاصيل الطلب:\s*([\s\S]*)/);const customHtml=noteText.includes("توصيلة خاصة")?'<div style="background:#fff4df;border:1px solid #efc36b;border-radius:10px;padding:12px;margin:10px 0;color:#503400"><b>🛍️ توصيل خاص — المطلوب من السائق:</b>'+(customMatch?'<p><b>المتجر:</b> '+esc(customMatch[1])+'</p><p><b>تفاصيل الطلب:</b><br>'+esc(customMatch[2])+'</p>':'<p>'+esc(noteText)+'</p>')+'</div>':(noteText?'<p><b>ملاحظات الطلب:</b> '+esc(noteText)+'</p>':"");const itemHtml=its.length?'<ul>'+its.map(i=>'<li>'+esc(i.product_name)+' × '+esc(i.quantity)+' — '+esc(i.unit_price_syp)+' ل.س للقطعة (الإجمالي '+esc(i.line_total_syp)+' ل.س)</li>').join('')+'</ul>'+customHtml:customHtml||'<p class="muted">تفاصيل المنتجات غير متاحة لهذا الطلب حالياً.</p>';return '<article class="panel" style="'+(mine?'border:2px solid #8bd3a2;background:#f2fff5;':'')+'"><div class="row"><b>طلب #'+esc(o.order_number)+'</b><b>'+(mine?'<span style="color:#16834a">✓ تم الاستلام</span>':esc(o.status))+'</b></div>'+(canClaim?'<p class="muted">طلب متاح للاستلام</p>':"")+'<p>الزبون: '+esc(o.customer_name)+' • '+esc(o.customer_phone)+'</p><p><b>العنوان:</b> '+esc(loc.text)+'</p><h4>🛒 طلب الزبون (المنتجات والكميات)</h4>'+itemHtml+map+actions+'</article>';};
let html='<div class="tabs"><button type="button" class="driver-tab-btn active" data-tab="available" onclick="showDriverTab('available')">الطلبات المتاحة للاستلام ('+available.length+')</button><button type="button" class="driver-tab-btn" data-tab="received" onclick="showDriverTab('received')">الطلبات المستلمة ('+os.length+')</button></div>';html+='<section id="driver-tab-available" class="driver-tab-panel">'+(available.map(o=>render(o,true)).join("")||'<div class="panel">ما في طلبات متاحة حالياً.</div>')+'</section>';html+='<section id="driver-tab-received" class="driver-tab-panel hidden">'+(os.map(o=>render(o,false)).join("")||'<div class="panel">ما عندك طلبات مستلمة حالياً.</div>')+'</section>';box.innerHTML=html;renderMaps();}catch(e){box.innerHTML='<div class="panel">تعذر تحميل الطلبات: '+esc(e.message||"خطأ غير معروف")+'</div>';}}

setInterval(()=>{if(session?.access_token&&!document.getElementById("app").classList.contains("hidden"))start().catch(()=>{});},40000);
window.addEventListener("DOMContentLoaded",async()=>{try{const saved=localStorage.getItem(SESSION_KEY);if(!saved)return;session=JSON.parse(saved);if(!session?.refresh_token){clearSession();return}if(session.expires_at&&Date.now()/1000>session.expires_at-60)await refreshSession();const role=String(session.user?.app_metadata?.role||"").toLowerCase().trim();isAdmin=role==="admin";isAdmin=role==="admin";showApp();await start();await restoreDriverPush()}catch(e){document.getElementById("orders").innerHTML='<div class="panel">تعذر استعادة الجلسة أو تحميل الطلبات: '+esc(e.message||"خطأ غير معروف")+'</div>';if(!session?.refresh_token)clearSession()}});</script></body></html>
