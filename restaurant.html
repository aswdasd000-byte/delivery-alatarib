<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4165df">
<meta name="description" content="لوحة مطعم ديليفري الأتارب">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>المطعم | ديليفري الأتارب</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--brand:#4165df;--accent:#ff7626;--bg:#171717;--surface:#222;--surface2:#292929;--line:#383838;--text:#f7f7f7;--muted:#bdbdbd;--success:#39b978;--danger:#c84b4b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding:0 0 calc(90px + env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
header{position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;padding:10px 14px;box-shadow:0 3px 14px #0004}
.brandbar{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}
.brand-logo{width:42px;height:42px;object-fit:cover;border-radius:12px;background:#fff;flex:0 0 42px}
.brand-title{min-width:0;flex:1}.brand-title h1{font-size:17px;margin:0;font-weight:850}.brand-title p{font-size:11px;margin:3px 0 0;opacity:.9}
.header-link{color:#fff;text-decoration:none;font-size:12px;font-weight:700;background:#ffffff20;padding:9px 11px;border-radius:12px;white-space:nowrap}
main{max-width:900px;margin:auto;padding:14px 14px 30px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #0002}
h2,h3,h4{margin-top:0}h3{font-size:18px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:750;transition:filter .15s,transform .15s}
button:active{transform:scale(.98)}button:disabled{opacity:.55;cursor:wait}
input,select{font:inherit;color:#fff;background:#303030;border:1px solid #505050;border-radius:11px;width:100%;padding:12px;margin:7px 0 14px;min-height:46px}
label{display:block;font-size:13px;color:#ddd;font-weight:700}
.muted{color:var(--muted);font-size:13px;line-height:1.65}
.hidden{display:none!important}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.danger{background:var(--danger)}
#login{max-width:520px;margin:28px auto}
#login h3{margin-bottom:18px}
#loginBtn{width:100%;min-height:48px}
#dashboardContent>.row{background:linear-gradient(120deg,#263b83,#4165df);border-radius:18px;padding:17px;margin:0 0 12px}
#dashboardContent>.row h3{margin:0;color:white}
#dashboardContent>.row button{background:#fff;color:#2947a5}
#dashboardContent>p{padding:0 4px}
#profilePanel .profile-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#profilePanel .profile-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.tabs button{background:#2c2c2c;color:#ddd;border:1px solid #454545;padding:12px 8px;font-size:13px}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#orders>.tabs{position:sticky;top:65px;z-index:10;background:var(--bg);padding:7px 0}
#orders article.panel{border-radius:17px}
#orders article.panel[style*="border:2px"]{background:#222!important;border-color:#39b978!important}
#orders article .row{padding-bottom:8px;border-bottom:1px solid var(--line)}
#orders article p{line-height:1.7}
#orders article h4{margin:15px 0 8px}
#orders article ul{padding-right:22px;line-height:1.9}
#orders article button{width:100%;margin:10px 0 0;min-height:48px}
#orders article a{color:#fff}
.map{height:230px;border-radius:14px;overflow:hidden;margin:12px 0;border:1px solid var(--line)}
.dashboard-bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#292929;border-top:1px solid #444;box-shadow:0 -5px 20px #0004}
.dashboard-bottom-nav button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:#bdbdbd;border-radius:13px;padding:12px 8px;font-weight:750}
.dashboard-bottom-nav button.active{background:#ff7626;color:#fff}
.dashboard-bottom-nav span{font-size:13px}
a{color:#8da8ff}
@media(max-width:600px){main{padding:12px 11px 24px}#profilePanel .profile-fields{grid-template-columns:1fr}.panel{padding:14px}.brand-title h1{font-size:15px}.header-link{padding:8px;font-size:11px}#orders>.tabs{top:62px}}
</style>
</head><body><header><div class="brandbar"><img class="brand-logo" src="./icon-192.png" alt="شعار ديليفري الأتارب"><div class="brand-title"><h1>ديليفري الأتارب</h1><p>لوحة المطعم • إدارة الطلبات</p></div><a class="header-link" href="./">واجهة الزبون</a></div></header><main><section id="login" class="panel"><h3>تسجيل الدخول</h3><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button id="loginBtn">دخول</button><p id="message" class="muted">الدخول مخصص للحسابات المصرّح لها فقط.</p></section><section id="app" class="hidden"><div class="panel hidden" id="profilePanel"><div class="row"><h3>👤 ملفي الشخصي</h3><button class="danger" type="button" onclick="logoutAccount()">تسجيل الخروج</button></div><p class="muted" id="profileEmail"></p><div class="profile-fields"><div><label>الاسم</label><input id="profileName" maxlength="100" placeholder="اسمك"></div><div><label>رقم الهاتف</label><input id="profilePhone" maxlength="30" placeholder="رقم الهاتف"></div><div><label>كلمة مرور جديدة (اختياري)</label><input id="profilePassword" type="password" minlength="8" placeholder="اتركها فارغة إذا لا تريد تغييرها"></div></div><div class="profile-actions"><button type="button" onclick="saveProfile()">حفظ بياناتي</button><p id="profileStatus" class="muted" role="status"></p></div></div><div id="dashboardContent"><div class="row"><h3>لوحة المطعم</h3><button type="button" onclick="start()">تحديث الطلبات</button></div><div class="panel"><button id="enableStorePush" type="button">🔔 تفعيل إشعارات المطعم</button><p id="storePushStatus" class="muted" aria-live="polite">فعّل الإشعارات على هذا الجهاز لاستقبال الطلبات الجديدة.</p></div><p class="muted" id="scopeNote">تعرض الطلبات الخاصة بالمطعم المحدد.</p><div id="adminStorePicker" class="hidden"><label>اختر المطعم</label><select id="storeSelect" onchange="start()"></select></div><div id="orders"></div></div><nav class="dashboard-bottom-nav"><button type="button" onclick="showDashboardTab('profile')">👤<span>ملفي الشخصي</span></button><button type="button" class="active" onclick="showDashboardTab('orders')">📦<span>الطلبات</span></button></nav></section></main><script>
function showDashboardTab(tab){const p=document.getElementById("profilePanel"),d=document.getElementById("dashboardContent");const isProfile=tab==="profile";p.classList.toggle("hidden",!isProfile);d.classList.toggle("hidden",isProfile);document.querySelectorAll(".dashboard-bottom-nav button").forEach((b,i)=>b.classList.toggle("active",isProfile?i===0:i===1));if(isProfile)renderProfile();window.scrollTo({top:0,behavior:"smooth"});}const URL="https://apreejawamptetdflwcf.supabase.co",KEY="sb_publishable_amN_E9EIKrjl_fk-ndm1YA_R7mI24j7";let session=null;let isAdmin=false;const SESSION_KEY="delivery_restaurant_session_v1";
function saveSession(){if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));}
function clearSession(){session=null;isAdmin=false;localStorage.removeItem(SESSION_KEY);}
function showApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");renderProfile();if(isAdmin){document.getElementById("adminStorePicker").classList.remove("hidden");document.getElementById("scopeNote").textContent="وضع المدير: اختر أي مطعم لمراجعة طلباته.";}else{document.getElementById("adminStorePicker").classList.add("hidden");document.getElementById("scopeNote").textContent="تعرض الطلبات الخاصة بالمطعم المرتبط بحسابك."}}
async function auth(path,body){let r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"فشل تسجيل الدخول");return d}
async function refreshSession(){if(!session?.refresh_token)throw Error("انتهت الجلسة، سجّل الدخول من جديد.");session=await auth("token?grant_type=refresh_token",{refresh_token:session.refresh_token});saveSession();return session}
async function api(path,opts={}){let r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}});if(r.status===401){await refreshSession();r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}})}let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("loginBtn").onclick=async()=>{let m=document.getElementById("message"),b=document.getElementById("loginBtn");b.disabled=true;try{session=await auth("token?grant_type=password",{email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});saveSession();const role=String(session.user?.app_metadata?.role||"").toLowerCase().trim();isAdmin=role==="admin";if(!isAdmin&&role!=="store"){clearSession();throw Error("صلاحية الحساب الحالية ("+(role||"غير محددة")+") لا تسمح بدخول لوحة المطعم. استخدم حساب المدير المعتاد أو أرسل صورة الرسالة.");}showApp();await start();await restoreStorePush();}catch(e){m.textContent=e.message||"تعذر الدخول";}finally{b.disabled=false}};
async function enableStorePush(){const b=document.getElementById("enableStorePush"),s=document.getElementById("storePushStatus");b.disabled=true;try{if(!("Notification"in window)||!("serviceWorker"in navigator)||!("PushManager"in window))throw Error("المتصفح لا يدعم الإشعارات.");if(await Notification.requestPermission()!=="granted")throw Error("لم يتم السماح بالإشعارات.");const keyResponse=await fetch(URL+"/functions/v1/push-public-key");const h=await keyResponse.json();if(!keyResponse.ok||!h.vapid_public_key)throw Error(h.error||"مفتاح الإشعارات غير متاح.");const bytes=Uint8Array.from(atob((h.vapid_public_key+"=".repeat((4-h.vapid_public_key.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));const reg=await navigator.serviceWorker.register("./service-worker.js");await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});let sid;if(isAdmin){sid=document.getElementById("storeSelect").value;}else{const a=await api("store_staff?select=store_id&user_id=eq."+encodeURIComponent(session.user.id));sid=a[0]?.store_id;}if(!sid)throw Error("الحساب غير مربوط بمطعم.");await api("push_subscriptions?on_conflict=endpoint,audience",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({endpoint:sub.endpoint,subscription:sub.toJSON(),audience:"store",store_id:sid,order_id:null,driver_user_id:null})});b.textContent="✅ إشعارات المطعم مفعّلة";s.textContent="تم حفظ الاشتراك للمطعم المحدد."; }catch(e){s.textContent="تعذر التفعيل: "+(e.message||"خطأ");}finally{b.disabled=false}}
document.getElementById("enableStorePush").addEventListener("click",enableStorePush);document.getElementById("storeSelect").addEventListener("change",()=>restoreStorePush());
async function restoreStorePush(){const s=document.getElementById("storePushStatus"),b=document.getElementById("enableStorePush");try{if(!("Notification"in window)||!("serviceWorker"in navigator)||!("PushManager"in window))return;if(Notification.permission!=="granted"){s.textContent="الإشعارات غير مسموحة من إعدادات المتصفح؛ فعّلها مرة واحدة من زر التفعيل.";return;}const reg=await navigator.serviceWorker.register("./service-worker.js");await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){const keyResponse=await fetch(URL+"/functions/v1/push-public-key");const h=await keyResponse.json();if(!keyResponse.ok||!h.vapid_public_key)throw Error(h.error||"مفتاح الإشعارات غير متاح.");const bytes=Uint8Array.from(atob((h.vapid_public_key+"=".repeat((4-h.vapid_public_key.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});}let sid;if(isAdmin){sid=document.getElementById("storeSelect").value;}else{const a=await api("store_staff?select=store_id&user_id=eq."+encodeURIComponent(session.user.id));sid=a[0]?.store_id;}if(!sid){s.textContent="تعذر ربط الإشعارات بالمطعم؛ تحقق من ربط الحساب.";return;}await api("push_subscriptions?on_conflict=endpoint,audience",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({endpoint:sub.endpoint,subscription:sub.toJSON(),audience:"store",store_id:sid,order_id:null,driver_user_id:null})});b.textContent="✅ إشعارات المطعم مفعّلة";s.textContent="الإشعارات مفعّلة ومحفوظة؛ ستُستعاد تلقائياً عند فتح الصفحة."; }catch(e){s.textContent="تعذر استعادة الإشعارات تلقائياً: "+(e.message||"خطأ");}}

setInterval(()=>{if(session?.access_token&&!document.getElementById("app").classList.contains("hidden"))start().catch(()=>{});},20000);
async function updateStatus(id,status){await api("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});await start()}
async function start(){
 let storeId;
 if(isAdmin){
  const stores=await api("stores?select=id,name&is_active=eq.true&order=name");
  const sel=document.getElementById("storeSelect"),previous=sel.value;
  if(!stores.length){document.getElementById("orders").innerHTML='<div class="panel">ما في مطاعم مفعّلة حالياً.</div>';return;}
  sel.innerHTML=stores.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join("");
  if(previous&&stores.some(s=>String(s.id)===previous))sel.value=previous;
  storeId=sel.value||stores[0].id;
 }else{
  const a=await api("store_staff?select=store_id&user_id=eq."+encodeURIComponent(session.user.id));
  if(!a.length){document.getElementById("orders").innerHTML='<div class="panel">حسابك غير مربوط بمطعم بعد. اطلب من المدير ربط حسابك بالمطعم.</div>';return;}
  storeId=a[0].store_id;
 }
 const ps=await api("products?select=id,name,store_id&store_id=eq."+encodeURIComponent(storeId));
 const ids=ps.map(p=>p.id);
 if(!ids.length){document.getElementById("orders").innerHTML='<div class="panel">لا توجد منتجات مرتبطة بهذا المطعم.</div>';return;}
 const items=await api("order_items?select=order_id,product_name,quantity,product_id&product_id=in.("+ids.join(",")+")");
 const oids=[...new Set(items.map(i=>i.order_id))];
 if(!oids.length){document.getElementById("orders").innerHTML='<div class="panel">لا توجد طلبات لهذا المطعم حالياً.</div>';return;}
 const os=await api("orders?select=id,order_number,customer_name,customer_phone,delivery_address,status,created_at,assigned_driver_id&id=in.("+oids.join(",")+")&order=created_at.desc");
 document.getElementById("orders").innerHTML=os.map(o=>{
  const its=items.filter(i=>i.order_id===o.id);
  let action=o.status==="جديد"
   ?'<button onclick="updateStatus(\''+o.id+'\',\'قيد التحضير\')">✅ قبول الطلب وبدء التحضير</button><button class="danger" onclick="updateStatus(\''+o.id+'\',\'ملغي\')">رفض الطلب</button>'
   :o.status==="قيد التحضير"
    ?'<p style="color:#16834a;font-weight:700">الطلب مقبول وقيد التحضير — بانتظار استلام السائق.</p>'
    :o.status==="بالطريق"
     ?'<p style="color:#1769aa;font-weight:700">🛵 السائق استلم الطلب وهو بالطريق للزبون.</p>'
     :o.status==="تم التسليم"
      ?'<p style="color:#16834a;font-weight:700">✅ تم تسليم الطلب للزبون.</p>'
      :'<p style="color:#a72b2b;font-weight:700">تم إلغاء الطلب.</p>';
  return '<article class="panel"><div class="row"><b>طلب #'+esc(o.order_number)+'</b><b>'+esc(o.status)+'</b></div><p><b>الزبون:</b> '+esc(o.customer_name)+' • '+esc(o.customer_phone)+'</p><p><b>العنوان:</b> '+esc(o.delivery_address)+'</p><ul>'+its.map(i=>'<li>'+esc(i.product_name)+' × '+esc(i.quantity)+'</li>').join('')+'</ul>'+action+'</article>';
 }).join("")||'<div class="panel">لا توجد طلبات لهذا المطعم حالياً.</div>';
}
window.addEventListener("DOMContentLoaded",async()=>{try{const saved=localStorage.getItem(SESSION_KEY);if(!saved)return;session=JSON.parse(saved);if(!session?.refresh_token){clearSession();return}if(session.expires_at&&Date.now()/1000>session.expires_at-60)await refreshSession();const role=String(session.user?.app_metadata?.role||"").toLowerCase().trim();isAdmin=role==="admin";if(!isAdmin&&role!=="store"){document.getElementById("message").textContent="الجلسة محفوظة لكن صلاحية الحساب الحالية ("+(role||"غير محددة")+") لا تسمح بدخول لوحة المطعم.";clearSession();return}showApp();await start();await restoreStorePush()}catch(e){document.getElementById("orders").innerHTML='<div class="panel">تعذر تحديث الجلسة أو تحميل الطلبات. جرّب تسجيل الدخول من جديد إذا استمرت المشكلة.</div>';if(!session?.refresh_token)clearSession()}});function toggleProfile(){const p=document.getElementById("profilePanel");p.classList.toggle("hidden");if(!p.classList.contains("hidden"))p.scrollIntoView({behavior:"smooth",block:"start"});}
function renderProfile(){const u=session?.user||{},d=u.user_metadata||{};document.getElementById("profileEmail").textContent="البريد: "+(u.email||"");document.getElementById("profileName").value=d.full_name||d.name||"";document.getElementById("profilePhone").value=d.phone||"";document.getElementById("profilePassword").value="";}
async function saveProfile(){const s=document.getElementById("profileStatus"),b=document.querySelector("#profilePanel button[onclick='saveProfile()']");b.disabled=true;s.textContent="جارٍ حفظ البيانات...";try{const data={...(session.user?.user_metadata||{}),full_name:document.getElementById("profileName").value.trim(),phone:document.getElementById("profilePhone").value.trim()};const password=document.getElementById("profilePassword").value;const payload={data};if(password){if(password.length<8)throw Error("كلمة المرور يجب أن تكون 8 أحرف على الأقل.");payload.password=password;}const r=await fetch(URL+"/auth/v1/user",{method:"PUT",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"تعذر حفظ البيانات.");session.user=d;saveSession();renderProfile();s.textContent="تم حفظ بيانات الملف الشخصي بنجاح.";}catch(e){s.textContent="تعذر الحفظ: "+(e.message||"خطأ");}finally{b.disabled=false;}}
async function logoutAccount(){try{if(session?.access_token)await fetch(URL+"/auth/v1/logout",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token}});}catch(e){}clearSession();location.reload();}</script></body></html>
