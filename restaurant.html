<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المطعم - ديليفري الأتارب</title><style>body{font-family:system-ui,Tahoma,Arial;background:#f4f7f5;color:#17211b;margin:0}header{background:#16834a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dfe8e2;border-radius:14px;padding:16px;margin:12px 0}button{background:#16834a;color:white;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px}input,select{font:inherit;padding:10px;border:1px solid #ccd7d0;border-radius:9px;width:100%;box-sizing:border-box;margin:6px 0 12px}.muted{color:#64746a}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.danger{background:#a72b2b}a{color:white}</style></head><body><header><h2>لوحة المطعم</h2><div>ديليفري الأتارب • <a href="./">واجهة الزبون</a></div></header><main><section id="login" class="panel"><h3>تسجيل الدخول</h3><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button id="loginBtn">دخول</button><p id="message" class="muted">الدخول مخصص للحسابات المصرّح لها فقط.</p></section><section id="app" class="hidden"><div class="row"><h3>لوحة المطعم</h3><button onclick="start()">تحديث الطلبات</button><button id="enableStorePush" type="button">🔔 تفعيل إشعارات المطعم</button></div><p id="storePushStatus" class="muted" aria-live="polite">فعّل الإشعارات على هذا الجهاز لاستقبال الطلبات الجديدة.</p><p class="muted" id="scopeNote">تعرض الطلبات الخاصة بالمطعم المحدد.</p><div id="adminStorePicker" class="hidden"><label>اختر المطعم</label><select id="storeSelect" onchange="start()"></select></div><div id="orders"></div></section></main><script>
const URL="https://apreejawamptetdflwcf.supabase.co",KEY="sb_publishable_amN_E9EIKrjl_fk-ndm1YA_R7mI24j7";let session=null;let isAdmin=false;const SESSION_KEY="delivery_restaurant_session_v1";
function saveSession(){if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));}
function clearSession(){session=null;isAdmin=false;localStorage.removeItem(SESSION_KEY);}
function showApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");if(isAdmin){document.getElementById("adminStorePicker").classList.remove("hidden");document.getElementById("scopeNote").textContent="وضع المدير: اختر أي مطعم لمراجعة طلباته.";}else{document.getElementById("adminStorePicker").classList.add("hidden");document.getElementById("scopeNote").textContent="تعرض الطلبات الخاصة بالمطعم المرتبط بحسابك."}}
async function auth(path,body){let r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"فشل تسجيل الدخول");return d}
async function refreshSession(){if(!session?.refresh_token)throw Error("انتهت الجلسة، سجّل الدخول من جديد.");session=await auth("token?grant_type=refresh_token",{refresh_token:session.refresh_token});saveSession();return session}
async function api(path,opts={}){let r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}});if(r.status===401){await refreshSession();r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}})}let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("loginBtn").onclick=async()=>{let m=document.getElementById("message"),b=document.getElementById("loginBtn");b.disabled=true;try{session=await auth("token?grant_type=password",{email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});saveSession();const role=String(session.user?.app_metadata?.role||"").toLowerCase().trim();isAdmin=role==="admin";if(!isAdmin&&role!=="store"){clearSession();throw Error("صلاحية الحساب الحالية ("+(role||"غير محددة")+") لا تسمح بدخول لوحة المطعم. استخدم حساب المدير المعتاد أو أرسل صورة الرسالة.");}showApp();await start();}catch(e){m.textContent=e.message||"تعذر الدخول";}finally{b.disabled=false}};
async function enableStorePush(){const b=document.getElementById("enableStorePush"),s=document.getElementById("storePushStatus");b.disabled=true;try{if(!("Notification"in window)||!("serviceWorker"in navigator)||!("PushManager"in window))throw Error("المتصفح لا يدعم الإشعارات.");if(await Notification.requestPermission()!=="granted")throw Error("لم يتم السماح بالإشعارات.");const h=await fetch(URL+"/functions/v1/push-health").then(r=>r.json());if(!h.vapid_public_key)throw Error("مفتاح الإشعارات غير متاح.");const bytes=Uint8Array.from(atob((h.vapid_public_key+"=".repeat((4-h.vapid_public_key.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));const reg=await navigator.serviceWorker.register("./service-worker.js");await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});let sid;if(isAdmin){sid=document.getElementById("storeSelect").value;}else{const a=await api("store_staff?select=store_id&user_id=eq."+encodeURIComponent(session.user.id));sid=a[0]?.store_id;}if(!sid)throw Error("الحساب غير مربوط بمطعم.");await api("push_subscriptions?on_conflict=endpoint",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({endpoint:sub.endpoint,subscription:sub.toJSON(),audience:"store",store_id:sid,order_id:null,driver_user_id:null})});b.textContent="✅ إشعارات المطعم مفعّلة";s.textContent="تم حفظ الاشتراك للمطعم المحدد."; }catch(e){s.textContent="تعذر التفعيل: "+(e.message||"خطأ");}finally{b.disabled=false}}\ndocument.getElementById("enableStorePush").addEventListener("click",enableStorePush);\nsetInterval(()=>{if(session?.access_token&&!document.getElementById("app").classList.contains("hidden"))start().catch(()=>{});},20000);\nasync function updateStatus(id,status){await api("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});await start()}
async function start(){let storeId;if(isAdmin){const stores=await api("stores?select=id,name&is_active=eq.true&order=name");const sel=document.getElementById("storeSelect");const previous=sel.value;if(!stores.length){document.getElementById("orders").innerHTML='<div class="panel">ما قدرنا نجيب قائمة المطاعم.</div>';return}sel.innerHTML=stores.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join("");if(previous&&stores.some(s=>String(s.id)===previous))sel.value=previous;storeId=sel.value||stores[0].id;}else{const a=await api("store_staff?select=store_id&user_id=eq."+session.user.id);if(!a.length){document.getElementById("orders").innerHTML='<div class="panel">حسابك غير مربوط بمطعم بعد. على المدير ربط حسابك بمطعم من قاعدة البيانات.</div>';return}storeId=a[0].store_id;}const ps=await api("products?select=id,name,store_id&store_id=eq."+storeId);const ids=ps.map(p=>p.id);if(!ids.length){document.getElementById("orders").innerHTML='<div class="panel">لا توجد منتجات مرتبطة بالمطعم.</div>';return}const items=await api("order_items?select=order_id,product_name,quantity,product_id&product_id=in.("+ids.join(",")+")");const oids=[...new Set(items.map(i=>i.order_id))];if(!oids.length){document.getElementById("orders").innerHTML='<div class="panel">لا توجد طلبات جديدة لمطعمك.</div>';return}const os=await api("orders?select=id,order_number,customer_name,customer_phone,delivery_address,status,created_at&id=in.("+oids.join(",")+")&order=created_at.desc");document.getElementById("orders").innerHTML=os.map(o=>'<article class="panel"><div class="row"><b>طلب #'+esc(o.order_number)+'</b><b>'+esc(o.status)+'</b></div><p>'+esc(o.customer_name)+' • '+esc(o.customer_phone)+'</p><p>العنوان: '+esc(o.delivery_address)+'</p><ul>'+items.filter(i=>i.order_id===o.id).map(i=>'<li>'+esc(i.product_name)+' × '+i.quantity+'</li>').join('')+'</ul><button onclick="updateStatus(\''+o.id+'\',\'قيد التحضير\')">قبول / قيد التحضير</button><button class="danger" onclick="updateStatus(\''+o.id+'\',\'ملغي\')">رفض الطلب</button></article>').join('')}
window.addEventListener("DOMContentLoaded",async()=>{try{const saved=localStorage.getItem(SESSION_KEY);if(!saved)return;session=JSON.parse(saved);if(!session?.refresh_token){clearSession();return}if(session.expires_at&&Date.now()/1000>session.expires_at-60)await refreshSession();const role=String(session.user?.app_metadata?.role||"").toLowerCase().trim();isAdmin=role==="admin";if(!isAdmin&&role!=="store"){document.getElementById("message").textContent="الجلسة محفوظة لكن صلاحية الحساب الحالية ("+(role||"غير محددة")+") لا تسمح بدخول لوحة المطعم.";clearSession();return}showApp();await start()}catch(e){document.getElementById("orders").innerHTML='<div class="panel">تعذر تحديث الجلسة أو تحميل الطلبات. جرّب تسجيل الدخول من جديد إذا استمرت المشكلة.</div>';if(!session?.refresh_token)clearSession()}});</script></body></html>
