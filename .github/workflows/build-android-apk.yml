name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'capacitor-app/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies and build local native shell
        run: |
          npm install
          npm run build:android
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Firebase and sync Capacitor
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 repository secret"
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Generated Android Gradle files were not found")
          rs = root.read_text()
          plugin_line = "        classpath 'com.google.gms:google-services:4.4.2'"
          if "com.google.gms:google-services" not in rs:
              if "dependencies {" not in rs:
                  raise SystemExit("Could not find root Gradle dependencies block")
              rs = rs.replace("dependencies {", "dependencies {\n" + plugin_line, 1)
          root.write_text(rs)
          aps = app.read_text()
          if "com.google.gms.google-services" not in aps:
              if "apply plugin: 'com.android.application'" in aps:
                  aps = aps.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'", 1)
              elif "plugins {" in aps:
                  aps = aps.replace("plugins {", "plugins {\n    id 'com.google.gms.google-services'", 1)
              else:
                  raise SystemExit("Could not find Android application plugin declaration")
          app.write_text(aps)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-alatarib-debug-apk
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p downloads
          cp capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk downloads/delivery-alatarib.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/delivery-alatarib.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest Delivery Alatarib APK"
            git push
          fi
