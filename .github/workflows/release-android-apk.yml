name: Build signed Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ANDROID_${name#KEYSTORE_}"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies and generate Android project
        working-directory: capacitor-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          npm install
          npm run build:android
          npx cap add android
          mkdir -p android/app
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
          npx cap sync android
          # Configure the Google Services Gradle plugin required by Firebase Cloud Messaging.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Generated Android Gradle files were not found")
          rs = root.read_text()
          plugin_line = "        classpath 'com.google.gms:google-services:4.4.2'"
          if "com.google.gms:google-services" not in rs:
              if "dependencies {" not in rs:
                  raise SystemExit("Could not find root Gradle dependencies block")
              rs = rs.replace("dependencies {", "dependencies {\n" + plugin_line, 1)
          root.write_text(rs)
          aps = app.read_text()
          if "com.google.gms.google-services" not in aps:
              if "apply plugin: 'com.android.application'" in aps:
                  aps = aps.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'", 1)
              elif "plugins {" in aps:
                  aps = aps.replace("plugins {", "plugins {\n    id 'com.google.gms.google-services'", 1)
              else:
                  raise SystemExit("Could not find Android application plugin declaration")
          app.write_text(aps)
          PY

      - name: Generate branded Android app icon
        working-directory: capacitor-app
        run: |
          mkdir -p assets
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          icon = Image.open("../icon-512.png").convert("RGBA")
          icon.resize((1024, 1024), Image.Resampling.LANCZOS).save("assets/logo.png")
          PY
          npm install --no-save @capacitor/assets
          npx @capacitor/assets generate --android --iconBackgroundColor '#171717' --iconBackgroundColorDark '#171717'

      - name: Configure release signing
        working-directory: capacitor-app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release-key.jks
          cat > android/key.properties <<EOF
          storeFile=release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs {" not in s:
              s = s.replace("    buildTypes {", """    signingConfigs {
                  release {
                      def props = new Properties()
                      def propsFile = rootProject.file("key.properties")
                      props.load(new FileInputStream(propsFile))
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }

              buildTypes {""", 1)

          head, marker, tail = s.partition("    buildTypes {")
          if not marker:
              raise SystemExit("Could not find buildTypes block in app/build.gradle")
          tail = tail.replace(
              "        release {",
              "        release {\n            signingConfig signingConfigs.release",
              1
          )
          p.write_text(head + marker + tail)
          PY

      - name: Build signed release APK
        working-directory: capacitor-app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish versioned APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "ديليفري الأتارب v${{ inputs.version }}"
          generate_release_notes: true
          files: capacitor-app/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
