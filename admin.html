<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المدير - ديليفري الأتارب</title><style>body{font-family:system-ui,Tahoma,Arial;background:#f4f7f5;color:#17211b;margin:0}header{background:#16834a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dfe8e2;border-radius:14px;padding:16px;margin:12px 0}button{background:#16834a;color:white;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px}input,select{font:inherit;padding:10px;border:1px solid #ccd7d0;border-radius:9px;width:100%;box-sizing:border-box;margin:6px 0 12px}.muted{color:#64746a}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.danger{background:#a72b2b}a{color:white}</style></head><body><header><h2>لوحة المدير</h2><div>ديليفري الأتارب • <a href="./">واجهة الزبون</a></div></header><main><section id="login" class="panel"><h3>تسجيل الدخول</h3><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button id="loginBtn" type="button">دخول</button><p id="message" class="muted" role="status" aria-live="polite">الدخول مخصص للحسابات المصرّح لها فقط.</p></section><section id="app" class="hidden"><div class="row"><h3>لوحة المدير</h3><button class="danger" onclick="location.href='./'">خروج / الرئيسية</button></div><div class="panel"><button id="enableNotifications">🔔 تفعيل إشعارات الطلبات</button><button id="testNotifications" type="button">🧪 إرسال إشعار تجريبي</button><p id="notificationStatus" class="muted">فعّل الإشعارات على هذا الجهاز لاستقبال التنبيهات.</p></div><p class="muted">متابعة كل الطلبات. تعيين المطاعم والسائقين يحتاج ربط حساباتهم بجدول التخصيص من قاعدة البيانات.</p><div id="orders"></div></section></main><script>
const URL="https://apreejawamptetdflwcf.supabase.co",KEY="sb_publishable_amN_E9EIKrjl_fk-ndm1YA_R7mI24j7";let session=null;const SESSION_KEY="delivery_admin_session_v1";function cookieSet(name,value,days=30){document.cookie=name+"="+encodeURIComponent(value)+"; Max-Age="+(days*86400)+"; Path=/; SameSite=Lax; Secure"}function cookieGet(name){const m=document.cookie.match(new RegExp("(?:^|; )"+name+"=([^;]*)"));return m?decodeURIComponent(m[1]):""}function saveSession(){try{if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));else localStorage.removeItem(SESSION_KEY)}catch(e){}if(session?.refresh_token)cookieSet("delivery_admin_refresh",session.refresh_token);else document.cookie="delivery_admin_refresh=; Max-Age=0; Path=/; SameSite=Lax; Secure"}
async function auth(path,body){let r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"فشل تسجيل الدخول");return d}
async function refreshSession(){if(!session?.refresh_token)throw Error("انتهت الجلسة، سجّل الدخول من جديد.");const d=await auth("token?grant_type=refresh_token",{refresh_token:session.refresh_token});if(d.user?.app_metadata?.role!=="admin")throw Error("هذا الحساب ليس مخوّلاً لهذه اللوحة.");session=d;saveSession();return session}
async function api(path,opts={},retried=false){let r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}});if(r.status===401&&!retried){await refreshSession();return api(path,opts,true)}let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function urlBase64ToUint8Array(base64String){const padding="=".repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");const raw=atob(base64);return Uint8Array.from([...raw].map(ch=>ch.charCodeAt(0)))}
document.getElementById("enableNotifications").addEventListener("click",async()=>{const status=document.getElementById("notificationStatus"),button=document.getElementById("enableNotifications");button.disabled=true;status.textContent="جارٍ تفعيل الإشعارات...";try{if(!session?.access_token)throw Error("سجّل الدخول إلى لوحة المدير أولاً.");if(!("Notification"in window)||!("serviceWorker"in navigator)||!("PushManager"in window))throw Error("المتصفح لا يدعم إشعارات Push؛ جرّب Chrome.");const permission=await Notification.requestPermission();if(permission!=="granted")throw Error("اسمح بالإشعارات من إعدادات المتصفح.");const hr=await fetch(URL+"/functions/v1/push-health",{headers:{apikey:KEY,Authorization:"Bearer "+session.access_token}});const h=await hr.json().catch(()=>({}));if(!hr.ok)throw Error("تعذر فحص إعدادات الإشعارات؛ سجّل الدخول مجدداً.");if(!h.vapid_public_key||!h.secrets_present?.VAPID_PUBLIC_KEY||!h.secrets_present?.VAPID_PRIVATE_KEY||!h.secrets_present?.VAPID_SUBJECT||!h.format_checks?.public_key_looks_valid)throw Error("إعدادات Push على الخادم غير مكتملة؛ يلزم إكمال إعداد VAPID.");const reg=await navigator.serviceWorker.register("./service-worker.js");await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(h.vapid_public_key)});await api("push_subscriptions?on_conflict=endpoint",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({endpoint:sub.endpoint,subscription:sub.toJSON(),audience:"admin"})});button.textContent="✅ تم تفعيل الإشعارات";status.textContent="تم تفعيل الإشعارات وحفظ اشتراك هذا الجهاز بنجاح."}catch(e){console.error(e);button.textContent="🔔 تفعيل إشعارات الطلبات";status.textContent=e.message||"تعذر تفعيل الإشعارات."}finally{button.disabled=false}});
document.getElementById("testNotifications").addEventListener("click",async()=>{const status=document.getElementById("notificationStatus"),button=document.getElementById("testNotifications");button.disabled=true;status.textContent="جارٍ إرسال إشعار تجريبي...";try{if(!session?.access_token)throw Error("سجّل الدخول أولاً.");const r=await fetch(URL+"/functions/v1/push-send",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({audience:"admin",title:"ديليفري الأتارب",body:"هذا إشعار تجريبي للتأكد من عمل التنبيهات.",url:"/delivery-alatarib/admin.html"})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||("فشل الإرسال (HTTP "+r.status+")"));status.textContent="نتيجة الإرسال: اشتراكات "+d.subscriptions+"، وصل لمزوّد الإشعارات "+d.sent+"، فشل "+d.failed+". إذا sent أكبر من صفر ولم يظهر التنبيه، افحص إذن إشعارات Chrome وإعدادات بطارية الهاتف."; }catch(e){console.error(e);status.textContent="فشل الاختبار: "+(e.message||"خطأ غير معروف");}finally{button.disabled=false}});
async function refreshNotificationButton(){const button=document.getElementById("enableNotifications"),status=document.getElementById("notificationStatus");try{if("Notification"in window&&Notification.permission==="granted"&&"serviceWorker"in navigator){const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){button.textContent="✅ تم تفعيل الإشعارات";status.textContent="الإشعارات مفعّلة على هذا الجهاز.";return}}}catch(e){}button.textContent="🔔 تفعيل إشعارات الطلبات";status.textContent="فعّل الإشعارات على هذا الجهاز لاستقبال التنبيهات."}

document.getElementById("loginBtn").addEventListener("click",async(ev)=>{ev.preventDefault();const m=document.getElementById("message"),b=document.getElementById("loginBtn");b.disabled=true;m.textContent="جارٍ التحقق من بيانات الدخول...";try{session=await auth("token?grant_type=password",{email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(session.user?.app_metadata?.role!=="admin"){session=null;saveSession();throw Error("تم تسجيل الدخول لكن الحساب غير مخوّل كمدير.");}saveSession();await showApp();}catch(e){console.error("Admin login error:",e);m.textContent="تعذر الدخول: "+(e.message||"خطأ غير معروف");}finally{b.disabled=false}});
async function updateStatus(id,status){await api("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});await start()}
async function showApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await refreshNotificationButton();await start()}
window.addEventListener("DOMContentLoaded",async()=>{try{let raw="";try{raw=localStorage.getItem(SESSION_KEY)||""}catch(e){}if(raw)session=JSON.parse(raw);if(!session?.refresh_token){const rt=cookieGet("delivery_admin_refresh");if(rt)session={refresh_token:rt}}if(!session?.refresh_token)return;await refreshSession();await showApp()}catch(e){session=null;saveSession();document.getElementById("message").textContent="تعذر استعادة جلسة المدير: "+(e.message||"سجّل الدخول مجدداً");document.getElementById("login").classList.remove("hidden");document.getElementById("app").classList.add("hidden")}});
async function start(){try{
 const os=await api("orders?select=id,order_number,customer_name,customer_phone,delivery_address,notes,status,subtotal_syp,delivery_fee_syp,created_at,assigned_driver_id&order=created_at.desc");
 const details=await Promise.all(os.map(async o=>{try{return [o.id,await api("order_items?select=product_name,quantity,unit_price_syp,line_total_syp&order_id=eq."+encodeURIComponent(o.id))]}catch(e){return [o.id,[]]}}));
 const byOrder=new Map(details);
 document.getElementById("orders").innerHTML=os.map(o=>{const items=byOrder.get(o.id)||[];return '<article class="panel"><div class="row"><b>طلب #'+esc(o.order_number)+'</b><b>'+esc(o.status)+'</b></div><p><b>وقت الطلب:</b> '+esc(new Date(o.created_at).toLocaleString("ar"))+'</p><p><b>الزبون:</b> '+esc(o.customer_name)+' • '+esc(o.customer_phone)+'</p><p><b>العنوان:</b> '+esc(o.delivery_address)+'</p>'+(o.notes?'<p><b>ملاحظات:</b> '+esc(o.notes)+'</p>':'')+'<p><b>المنتجات المطلوبة:</b></p>'+(items.length?'<ul>'+items.map(i=>'<li>'+esc(i.product_name)+' × '+esc(i.quantity)+' — '+esc(i.unit_price_syp)+' ل.س للقطعة (الإجمالي '+esc(i.line_total_syp)+' ل.س)</li>').join('')+'</ul>':'<p class="muted">تفاصيل المنتجات غير متاحة لهذا الطلب.</p>')+'<p><b>المجموع:</b> '+esc(o.subtotal_syp)+' ل.س • <b>التوصيل:</b> '+esc(o.delivery_fee_syp||0)+' ل.س</p><label>تحديث الحالة</label><select onchange="updateStatus(\''+o.id+'\',this.value)">'+['جديد','قيد التحضير','بالطريق','تم التسليم','ملغي'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></article>'}).join('')||'<div class="panel">لا توجد طلبات.</div>'
 }catch(e){document.getElementById('orders').innerHTML='<div class="panel">تعذر تحميل الطلبات، لكن جلستك ما زالت محفوظة: '+esc(e.message)+'</div>';}}</script></body></html>
