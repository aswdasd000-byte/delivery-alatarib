<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المدير - ديليفري الأتارب</title><style>body{font-family:system-ui,Tahoma,Arial;background:#f4f7f5;color:#17211b;margin:0}header{background:#16834a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dfe8e2;border-radius:14px;padding:16px;margin:12px 0}button{background:#16834a;color:white;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px}input,select{font:inherit;padding:10px;border:1px solid #ccd7d0;border-radius:9px;width:100%;box-sizing:border-box;margin:6px 0 12px}.muted{color:#64746a}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.danger{background:#a72b2b}a{color:white}</style></head><body><header><h2>لوحة المدير</h2><div>ديليفري الأتارب • <a href="./">واجهة الزبون</a></div></header><main><section id="login" class="panel"><h3>تسجيل الدخول</h3><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button id="loginBtn">دخول</button><p id="message" class="muted">الدخول مخصص للحسابات المصرّح لها فقط.</p></section><section id="app" class="hidden"><div class="row"><h3>لوحة المدير</h3><button class="danger" onclick="location.href='./'">خروج / الرئيسية</button></div><p class="muted">متابعة كل الطلبات. تعيين المطاعم والسائقين يحتاج ربط حساباتهم بجدول التخصيص من قاعدة البيانات.</p><div id="orders"></div></section></main><script>
const URL="https://apreejawamptetdflwcf.supabase.co",KEY="sb_publishable_amN_E9EIKrjl_fk-ndm1YA_R7mI24j7";let session=null;
async function auth(path,body){let r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"فشل تسجيل الدخول");return d}
async function api(path,opts={}){let r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}});let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("loginBtn").onclick=async()=>{let m=document.getElementById("message"),b=document.getElementById("loginBtn");b.disabled=true;try{session=await auth("token?grant_type=password",{email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(session.user?.app_metadata?.role!=="admin"){session=null;throw Error("هذا الحساب ليس مخوّلاً لهذه اللوحة.");}document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await start();}catch(e){m.textContent=e.message||"تعذر الدخول";}finally{b.disabled=false}};
async function updateStatus(id,status){await api("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});await start()}
async function start(){const os=await api("orders?select=id,order_number,customer_name,customer_phone,delivery_address,status,subtotal_syp,created_at,assigned_driver_id&order=created_at.desc");document.getElementById("orders").innerHTML=os.map(o=>'<article class="panel"><div class="row"><b>طلب #'+esc(o.order_number)+'</b><b>'+esc(o.status)+'</b></div><p>'+esc(o.customer_name)+' • '+esc(o.customer_phone)+'</p><p>العنوان: '+esc(o.delivery_address)+'</p><p>المجموع: '+esc(o.subtotal_syp)+' ل.س</p><label>تحديث الحالة</label><select onchange="updateStatus(\''+o.id+'\',this.value)">'+['جديد','قيد التحضير','بالطريق','تم التسليم','ملغي'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></article>').join('')||'<div class="panel">لا توجد طلبات.</div>'}
</script></body></html>
