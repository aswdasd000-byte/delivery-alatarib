<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المدير - ديليفري الأتارب</title><style>body{font-family:system-ui,Tahoma,Arial;background:#f4f7f5;color:#17211b;margin:0}header{background:#16834a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dfe8e2;border-radius:14px;padding:16px;margin:12px 0}button{background:#16834a;color:white;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px}input,select{font:inherit;padding:10px;border:1px solid #ccd7d0;border-radius:9px;width:100%;box-sizing:border-box;margin:6px 0 12px}.muted{color:#64746a}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.danger{background:#a72b2b}a{color:white}</style></head><body><header><h2>لوحة المدير</h2><div>ديليفري الأتارب • <a href="./">واجهة الزبون</a></div></header><main><section id="login" class="panel"><h3>تسجيل الدخول</h3><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button id="loginBtn">دخول</button><p id="message" class="muted">الدخول مخصص للحسابات المصرّح لها فقط.</p></section><section id="app" class="hidden"><div class="row"><h3>لوحة المدير</h3><button class="danger" onclick="location.href='./'">خروج / الرئيسية</button></div><p class="muted">متابعة كل الطلبات. تعيين المطاعم والسائقين يحتاج ربط حساباتهم بجدول التخصيص من قاعدة البيانات.</p><div id="orders"></div></section></main><script>
const URL="https://apreejawamptetdflwcf.supabase.co",KEY="sb_publishable_amN_E9EIKrjl_fk-ndm1YA_R7mI24j7";let session=null;const SESSION_KEY="delivery_admin_session_v1";function saveSession(){if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));else localStorage.removeItem(SESSION_KEY)}
async function auth(path,body){let r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"فشل تسجيل الدخول");return d}
async function refreshSession(){if(!session?.refresh_token)throw Error("انتهت الجلسة، سجّل الدخول من جديد.");const d=await auth("token?grant_type=refresh_token",{refresh_token:session.refresh_token});if(d.user?.app_metadata?.role!=="admin")throw Error("هذا الحساب ليس مخوّلاً لهذه اللوحة.");session=d;saveSession();return session}
async function api(path,opts={},retried=false){let r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",...(opts.headers||{})}});if(r.status===401&&!retried){await refreshSession();return api(path,opts,true)}let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("loginBtn").onclick=async()=>{let m=document.getElementById("message"),b=document.getElementById("loginBtn");b.disabled=true;try{session=await auth("token?grant_type=password",{email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(session.user?.app_metadata?.role!=="admin"){session=null;saveSession();throw Error("هذا الحساب ليس مخوّلاً لهذه اللوحة.");}saveSession();await showApp();}catch(e){m.textContent=e.message||"تعذر الدخول";}finally{b.disabled=false}};
async function updateStatus(id,status){await api("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});await start()}
async function showApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await start()}
window.addEventListener("DOMContentLoaded",async()=>{const raw=localStorage.getItem(SESSION_KEY);if(!raw)return;try{session=JSON.parse(raw);if(!session?.access_token||!session?.refresh_token)throw Error("لا توجد جلسة قابلة للتجديد");const expiresAt=Number(session.expires_at||0);if(expiresAt&&expiresAt*1000<Date.now()+60000)await refreshSession();if(session.user?.app_metadata?.role!=="admin")throw Error("الحساب غير مخوّل.");await showApp()}catch(e){session=null;saveSession();document.getElementById("message").textContent="تعذر التحقق من جلسة المدير: "+(e.message||"سجّل الدخول مجدداً");document.getElementById("login").classList.remove("hidden");document.getElementById("app").classList.add("hidden")}});
async function start(){try{const os=await api("orders?select=id,order_number,customer_name,customer_phone,delivery_address,status,subtotal_syp,created_at,assigned_driver_id&order=created_at.desc");document.getElementById("orders").innerHTML=os.map(o=>'<article class="panel"><div class="row"><b>طلب #'+esc(o.order_number)+'</b><b>'+esc(o.status)+'</b></div><p>'+esc(o.customer_name)+' • '+esc(o.customer_phone)+'</p><p>العنوان: '+esc(o.delivery_address)+'</p><p>المجموع: '+esc(o.subtotal_syp)+' ل.س</p><label>تحديث الحالة</label><select onchange="updateStatus(\''+o.id+'\',this.value)">'+['جديد','قيد التحضير','بالطريق','تم التسليم','ملغي'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></article>').join('')||'<div class="panel">لا توجد طلبات.</div>'}catch(e){document.getElementById('orders').innerHTML='<div class="panel">تعذر تحميل الطلبات، لكن جلستك ما زالت محفوظة: '+esc(e.message)+'</div>';}}
</script></body></html>
